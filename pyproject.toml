[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnilapse"
version = "0.1.0"
description = "Turn photos, videos, mixed sources, and live streams (RTSP/HTTP) into timelapses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "SlammingProgramming" }]
keywords = ["timelapse", "ffmpeg", "video", "rtsp", "photography", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
omnilapse = "omnilapse.cli:main"

[project.urls]
Homepage = "https://github.com/slammingprogramming/omnilapse"
Repository = "https://github.com/slammingprogramming/omnilapse"
Issues = "https://github.com/slammingprogramming/omnilapse/issues"
Changelog = "https://github.com/slammingprogramming/omnilapse/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
